<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeAlpha - Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Interactive Image Gallery</h1>
      <!-- Filter Buttons -->
      <div class="filter-buttons">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="nature">Nature</button>
        <button class="filter-btn" data-category="tech">Tech</button>
        <button class="filter-btn" data-category="city">City</button>
        <button class="filter-btn" data-category="animals">Animals</button>
        <button class="filter-btn" data-category="food">Food</button>
        <button class="filter-btn" data-category="cars">Cars</button>
        <button class="filter-btn" data-category="sports">Sports</button>
        <button class="filter-btn" data-category="clothing">Clothing</button>
      </div>
    </header>

    <!-- Gallery Grid -->
    <main class="gallery-container">
      <!-- NATURE -->
      <div
        class="gallery-item"
        data-category="nature"
        data-title="Mountain View"
        data-description="Serene snow-capped peaks rising above a quiet pine valley."
      >
        <img src="image/nature-1.jpg" alt="Mountain View" />
      </div>
      <div
        class="gallery-item"
        data-category="nature"
        data-title="Green Forest Trail"
        data-description="Sunlight filtering through lush pine trees on a misty morning path."
      >
        <img src="image/nature-2.jpg" alt="Green Forest Trail" />
      </div>
      <div
        class="gallery-item"
        data-category="nature"
        data-title="Sunset Horizon"
        data-description="A dramatic ocean sunset painting the clouds in gold and crimson."
      >
        <img src="image/nature-3.jpg" alt="Sunset Horizon" />
      </div>

      <!-- TECH -->
      <div
        class="gallery-item"
        data-category="tech"
        data-title="Developer Workspace"
        data-description="Modern workstation setup with multiple monitors running clean code."
      >
        <img src="image/tech-1.jpg" alt="Developer Workspace" />
      </div>
      <div
        class="gallery-item"
        data-category="tech"
        data-title="Cyber Security Desk"
        data-description="Futuristic neon LED gaming and development setup in high resolution."
      >
        <img src="image/tech-2.jpg" alt="Cyber Security Desk" />
      </div>
      <div
        class="gallery-item"
        data-category="tech"
        data-title="Circuit Board Details"
        data-description="Close-up micro-chip architecture powered by modern silicon engineering."
      >
        <img src="image/tech-3.jpg" alt="Circuit Board Details" />
      </div>

      <!-- CITY -->
      <div
        class="gallery-item"
        data-category="city"
        data-title="Night Skyline"
        data-description="Vibrant urban metropolis illuminated against the deep evening sky."
      >
        <img src="image/city-1.jpg" alt="Night Skyline" />
      </div>
      <div
        class="gallery-item"
        data-category="city"
        data-title="Urban Architecture"
        data-description="Symmetrical skyscrapers featuring reflective glass modern facade architecture."
      >
        <img src="image/city-2.jpg" alt="Urban Architecture" />
      </div>
      <div
        class="gallery-item"
        data-category="city"
        data-title="Busy Street Intersection"
        data-description="Fast-paced city life highlighted by blurred traffic light trails."
      >
        <img src="image/city-3.jpg" alt="Busy Street Intersection" />
      </div>

      <!-- ANIMALS -->
      <div
        class="gallery-item"
        data-category="animals"
        data-title="Majestic Lion"
        data-description="A powerful lion resting gracefully in the golden savanna sunlight."
      >
        <img src="image/animals-1.jpg" alt="Majestic Lion" />
      </div>
      <div
        class="gallery-item"
        data-category="animals"
        data-title="Playful Golden Retriever"
        data-description="Happy puppy outdoors running freely through open green fields."
      >
        <img src="image/animals-2.jpg" alt="Playful Puppy" />
      </div>
      <div
        class="gallery-item"
        data-category="animals"
        data-title="Feline Portrait"
        data-description="Detailed close-up showing vibrant amber eyes of a sleeping cat."
      >
        <img src="image/animals-3.jpg" alt="Feline Portrait" />
      </div>

      <!-- FOOD -->
      <div
        class="gallery-item"
        data-category="food"
        data-title="Fresh Gourmet Pizza"
        data-description="Artisanal wood-fired pizza topped with fresh basil and melted mozzarella."
      >
        <img src="images/food-1.jpg" alt="Fresh Gourmet Pizza" />
      </div>
      <div
        class="gallery-item"
        data-category="food"
        data-title="Fine Dining Plating"
        data-description="Beautifully garnished chef plate prepared with fresh local ingredients."
      >
        <img src="images/food-2.jpg" alt="Fine Dining Plating" />
      </div>
      <div
        class="gallery-item"
        data-category="food"
        data-title="Juicy Gourmet Burger"
        data-description="Stacked double beef burger served with crispy golden French fries."
      >
        <img src="images/food-3.jpg" alt="Juicy Gourmet Burger" />
      </div>

      <!-- CARS -->
      <div
        class="gallery-item"
        data-category="cars"
        data-title="Modern Supercar"
        data-description="Aerodynamic high-performance exotic sports vehicle engineered for speed."
      >
        <img src="images/cars-1.jpg" alt="Modern Supercar" />
      </div>
      <div
        class="gallery-item"
        data-category="cars"
        data-title="Classic Vintage Roadster"
        data-description="Timeless classic automobile preserved in stunning original condition."
      >
        <img src="images/cars-2.jpg" alt="Classic Vintage Roadster" />
      </div>
      <div
        class="gallery-item"
        data-category="cars"
        data-title="Luxury Sedan"
        data-description="Sleek metallic black executive sedan parked in front of a modern structure."
      >
        <img src="images/cars-3.jpg" alt="Luxury Sedan" />
      </div>

      <!-- SPORTS -->
      <div
        class="gallery-item"
        data-category="sports"
        data-title="Basketball Action"
        data-description="High-energy athletic moment captured right during a competitive game."
      >
        <img src="images/sports-1.jpg" alt="Basketball Action" />
      </div>
      <div
        class="gallery-item"
        data-category="sports"
        data-title="Morning Trail Run"
        data-description="Endurance athlete maintaining pace during an early sunrise trail run."
      >
        <img src="images/sports-2.jpg" alt="Morning Trail Run" />
      </div>
      <div
        class="gallery-item"
        data-category="sports"
        data-title="Soccer Stadium Lights"
        data-description="Professional soccer pitch illuminated under bright evening stadium floodlights."
      >
        <img src="images/sports-3.jpg" alt="Soccer Stadium Lights" />
      </div>

      <!-- CLOTHING -->
      <div
        class="gallery-item"
        data-category="clothing"
        data-title="Urban Streetwear"
        data-description="Contemporary oversized casual hoodie and streetwear collection display."
      >
        <img src="images/clothing-1.jpg" alt="Urban Streetwear" />
      </div>
      <div
        class="gallery-item"
        data-category="clothing"
        data-title="Denim Jacket Style"
        data-description="Classic rugged blue denim outerwear styled with minimalist aesthetic."
      >
        <img src="images/clothing-2.jpg" alt="Denim Jacket Style" />
      </div>
      <div
        class="gallery-item"
        data-category="clothing"
        data-title="Formal Mens Suit"
        data-description="Tailored classic luxury suit designed with premium modern tailoring."
      >
        <img src="images/clothing-3.jpg" alt="Formal Mens Suit" />
      </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
      <span class="close-btn">&times;</span>
      <button class="nav-btn prev-btn">&#10094;</button>
      <div class="lightbox-content">
        <img class="lightbox-img" src="" alt="Enlarged View" />
        <div class="lightbox-caption">
          <h3 id="caption-title"></h3>
          <p id="caption-description"></p>
        </div>
      </div>
      <button class="nav-btn next-btn">&#10095;</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
